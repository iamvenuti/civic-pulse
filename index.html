<title>Civic Pulse Questions</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='5' width='54' height='54' rx='14' fill='%231E2833'/%3E%3Cpolyline points='12,35 22,35 27.5,43 37,19 42.5,35 52,35' fill='none' stroke='%235CC2AE' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Layout: one column under a masthead with the mark; welcome, then one question per screen
   (story card, question, answer cards), nav pinned at thumb reach. Keys, points and reasons ship
   base64-encoded and show only after the participant asks for results. */
:root {
  --page: #f3f1ec;
  --surface: #fcfbf8;
  --sunk: #e9e5dc;
  --ink: #1e2833;
  --muted: #5d6570;
  --line: #dbd6cb;
  --accent: #1d6b60;
  --accent-ink: #ffffff;
  --accent-soft: #e2eee9;
  --warn: #a3402b;
  --warn-soft: #f6e3dc;
  --half: #8a5d00;
  --half-soft: #f7ecd2;
  --tile: #1e2833;
  --pulse: #5cc2ae;
  --shadow: rgb(30 40 51 / .10);
  --serif: "Baskervville", "Libre Baskerville", Baskerville, Georgia, serif;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #141a21; --surface: #1e2833; --sunk: #18212b; --ink: #f2eee6; --muted: #a4abb3; --line: #304050;
    --accent: #74c7b5; --accent-ink: #0f1a17; --accent-soft: #1f3a37; --warn: #ee9c86; --warn-soft: #3a2622; --half: #e5b65c; --half-soft: #3a3020;
    --tile: #f2eee6; --pulse: #1d6b60; --shadow: rgb(0 0 0 / .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #141a21; --surface: #1e2833; --sunk: #18212b; --ink: #f2eee6; --muted: #a4abb3; --line: #304050;
  --accent: #74c7b5; --accent-ink: #0f1a17; --accent-soft: #1f3a37; --warn: #ee9c86; --warn-soft: #3a2622; --half: #e5b65c; --half-soft: #3a3020;
  --tile: #f2eee6; --pulse: #1d6b60; --shadow: rgb(0 0 0 / .35); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--ink); font-family: var(--sans);
  font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 42rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.1rem 8rem;
  display: flex; flex-direction: column; gap: 1.5rem;
}
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* masthead */
.masthead { display: flex; flex-direction: column; gap: .55rem; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: .6rem; color: var(--ink); }
.brand svg { width: 2.2rem; height: 2.2rem; flex: none; }
.m-tile { fill: var(--tile); }
.m-pulse { fill: none; stroke: var(--pulse); stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
.word { font-family: var(--serif); font-weight: 600; font-size: 1.45rem; line-height: 1; }
.tools { display: flex; align-items: center; gap: .4rem; }
.link {
  font-size: .9rem; font-weight: 600; color: var(--accent); text-decoration: none;
  padding: .4rem .65rem; border-radius: 999px;
}
.link:hover { background: var(--accent-soft); }
.langs { display: inline-flex; gap: 2px; padding: 3px; background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; }
.langs button {
  display: inline-flex; align-items: center; gap: .4rem; border: 0; background: transparent; cursor: pointer;
  padding: .32rem .65rem .32rem .42rem; border-radius: 999px;
  font-size: .78rem; font-weight: 700; letter-spacing: .06em; color: var(--muted);
}
.langs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }
.flag { display: block; width: 1.35rem; height: .9rem; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px var(--line); }
.eyebrow { margin-top: .9rem; font-size: .74rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.95rem, 7vw, 2.6rem); line-height: 1.08; margin: 0; text-wrap: balance; }
h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.progress { height: 3px; margin-top: .45rem; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }

/* screens */
.panel { display: flex; flex-direction: column; gap: 1.05rem; }
.panel > p, .panel li { max-width: 65ch; }
.panel ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .5rem; }
.panel ul li::marker { color: var(--accent); }
.panel a:not(.big) { color: var(--accent); font-weight: 600; text-underline-offset: .2em; }
.lede { font-family: var(--serif); font-size: 1.3rem; line-height: 1.45; }
.chip {
  align-self: flex-start; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  padding: .28rem .7rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
}
.situation {
  background: var(--surface); border: 1px solid var(--line); border-radius: 1rem;
  padding: 1.05rem 1.2rem 1.2rem; display: flex; flex-direction: column; gap: .55rem;
}
.situation h2 {
  display: flex; justify-content: space-between; align-items: center; gap: .75rem;
  font-family: var(--sans); font-size: .76rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--accent);
}
.situation p { font-family: var(--serif); font-size: 1.17rem; line-height: 1.55; }
.say {
  display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; flex: none;
  border: 1px solid var(--line); background: var(--page); color: var(--ink); border-radius: 999px;
  padding: .3rem .7rem .3rem .55rem; font-size: .78rem; font-weight: 600; letter-spacing: 0; text-transform: none;
}
.say svg { width: 1rem; height: 1rem; }
.say path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.question { font-family: var(--serif); font-weight: 600; font-size: 1.42rem; line-height: 1.28; text-wrap: balance; }
.panel ul.options { list-style: none; padding: 0; gap: .55rem; }
.opt {
  width: 100%; text-align: left; display: flex; gap: .85rem; align-items: flex-start; cursor: pointer;
  padding: .85rem 1rem; border-radius: .9rem; border: 1.5px solid var(--line); background: var(--surface);
  transition: border-color .15s, background-color .15s;
}
.opt:hover:not([aria-disabled="true"]) { border-color: var(--accent); }
.opt .letter {
  flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center;
  font-size: .85rem; font-weight: 700; background: var(--sunk); color: var(--muted);
}
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .letter { background: var(--accent); color: var(--accent-ink); }
.opt .tick, .tag { margin-left: auto; align-self: center; font-size: .78rem; font-weight: 700; white-space: nowrap; color: var(--muted); }
.opt .tick, .tag.ok { color: var(--accent); }
.tag.no { color: var(--warn); }
.tag.half { color: var(--half); }
.opt[aria-disabled="true"] { cursor: default; }
.opt.is-key { border-color: var(--accent); }
.opt.is-key .letter { background: var(--accent); color: var(--accent-ink); }
.opt.is-wrong { border: 1.5px dashed var(--warn); background: var(--warn-soft); }
.opt.is-wrong .letter { background: var(--warn); color: var(--surface); }
.opt.is-half { border: 1.5px dashed var(--half); background: var(--half-soft); }
.opt.is-half .letter { background: var(--half); color: var(--surface); }
.opt.is-mine { border-style: dashed; border-color: var(--muted); }
.reason { background: var(--accent-soft); border-radius: .9rem; padding: 1rem 1.15rem; display: flex; flex-direction: column; gap: .35rem; }
.reason h2 { font-family: var(--sans); font-size: .76rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); }
.step {
  background: var(--surface); border: 1px solid var(--line); border-radius: 1rem;
  padding: 1.1rem 1.2rem 1.2rem; display: flex; flex-direction: column; gap: .75rem;
}
.row { display: flex; gap: .6rem; flex-wrap: wrap; }
.big {
  display: inline-block; text-decoration: none; cursor: pointer; text-align: center;
  padding: .85rem 1.35rem; border-radius: 999px; border: 1.5px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font-size: 1rem; font-weight: 700;
}
.big.quiet { background: transparent; color: var(--accent); }
.note { font-size: .86rem; color: var(--muted); }
/* score bar: 0 to the highest score, red turning to green at the mark from the scoring workbook (--mid) */
.gauge { position: relative; padding-top: 2.1rem; padding-bottom: 1.5rem; max-width: 32rem; }
.track { height: 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .08);
  background: linear-gradient(90deg, #8f1d1d 0%, #c0412c calc(var(--mid) * .42), #df7f36 calc(var(--mid) * .75), #e9c04c var(--mid),
    #93c05a calc(var(--mid) + (100% - var(--mid)) * .34), #3e9a4f calc(var(--mid) + (100% - var(--mid)) * .67), #135f3a 100%); }
.pin { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.pin b { font-size: .78rem; font-weight: 700; white-space: nowrap; padding: .12rem .5rem; border-radius: 999px; background: var(--ink); color: var(--page); font-variant-numeric: tabular-nums; }
.pin i { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--ink); }
.pin s { width: 3px; height: 20px; margin-top: 1px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--page); }
.pin.edge-l { transform: translateX(-12%); align-items: flex-start; }
.pin.edge-r { transform: translateX(-88%); align-items: flex-end; }
.ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 1.3rem; font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks span { position: absolute; transform: translateX(-50%); }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.ticks .mid { color: var(--ink); font-weight: 700; }
.notch { position: absolute; bottom: 1.5rem; width: 1px; height: 22px; background: var(--ink); opacity: .35; transform: translateX(-50%); }
.step label { display: block; font-weight: 600; margin: .6rem 0 .3rem; }
.step textarea { width: 100%; box-sizing: border-box; min-height: 5.5rem; padding: .6rem .7rem; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: .7rem; resize: vertical; }
.step textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.big[disabled] { opacity: .6; cursor: default; }
.summary { color: var(--muted); font-variant-numeric: tabular-nums; }
.score { font-family: var(--serif); font-weight: 600; font-size: 2.6rem; line-height: 1.05; font-variant-numeric: lining-nums tabular-nums; }
.panel ul.results {
  list-style: none; padding: 0; display: grid; gap: .4rem;
  grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr));
}
.results li { display: flex; align-items: center; gap: .5rem; padding: .3rem .4rem; border: 1px solid var(--line); border-radius: .7rem; background: var(--surface); }
.ghost {
  border: 1px solid var(--line); background: var(--page); color: var(--accent); cursor: pointer;
  border-radius: .55rem; padding: .3rem .55rem; font-size: .88rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.results .ghost { min-width: 3.1rem; }
.mark { font-size: .88rem; font-weight: 600; }
.mark.ok { color: var(--accent); }
.mark.no { color: var(--warn); }
.mark.half { color: var(--half); }
.results .pts { margin-left: auto; font-size: .88rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.mark.na { color: var(--muted); }
.about { display: flex; flex-direction: column; gap: .85rem; }
.about p, .about li { max-width: 65ch; }
.about h2 { margin-top: .9rem; font-size: 1.4rem; }
.about ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .45rem; }
.about li::marker { color: var(--accent); }
body.reading nav { display: none; }
body.reading .progress { visibility: hidden; }

/* nav */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: .65rem; padding-bottom: calc(.65rem + env(safe-area-inset-bottom, 0px));
}
nav .inner { max-width: 42rem; margin: 0 auto; display: flex; gap: .6rem; align-items: center; }
nav button {
  flex: 1; padding: .8rem; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 700; cursor: pointer;
}
nav button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
nav button:disabled { opacity: .35; cursor: default; }
nav .count { font-size: .82rem; font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .progress > span, .opt { transition: none; } }
</style>
</head>

<div class="wrap">
  <header class="masthead">
    <div class="bar">
      <span class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect class="m-tile" x="5" y="5" width="54" height="54" rx="14"/><polyline class="m-pulse" points="12,35 22,35 27.5,43 37,19 42.5,35 52,35"/></svg>
        <span class="word">Civic Pulse</span>
      </span>
      <span class="tools">
        <a class="link" id="about-link" href="#about"></a>

          <button type="button" data-lang="it" lang="it" aria-label="Italiano"><svg class="flag" viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#ffffff"/><rect x="2" width="1" height="2" fill="#CE2B37"/></svg>IT</button>
        </span>

    </div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="h1"></h1>
    <div class="progress" aria-hidden="true"><span id="prog"></span></div>

  <main id="view" aria-live="polite"></main>
</div>

<nav>

    <button id="prev" type="button"></button>
    <span class="count" id="count"></span>
    <button id="next" type="button" class="primary"></button>
  </div>
</nav>

 person weighs reasons, evidence and conclusions.<\/p><p>The questions ask you to weigh the information in a short story and choose the answer that best fits the facts. The test does not ask what you think about politics, and no answer gets a point for agreeing with any side.<\/p><h2>The approach<\/h2><ul><li>Each question starts from a short everyday situation: a bakery, a speed sign, a lunch that went missing. The situation gives you every fact you need.<\/li><li>There is no clock. You can stop, go back and change an answer.<\/li><li>We aim to use everyday words so you can focus on the reasoning.<\/li><li>You can listen to the questions as well as read them, so people who cannot see the screen can take part.<\/li><li>An app applies the same scoring rules to everyone, so no examiner&#x27;s personal view affects a result. Whether that makes the test fair is something we still have to check.<\/li><li>Every question has a written explanation of its answer, so anyone can see why it is marked the way it is.<\/li><li>The questions are our own. Existing reasoning tests, such as the Watson-Glaser, gave us ideas, but we did not copy their questions.<\/li><\/ul><h2>How the score works<\/h2><p>Every answer you give scores points. The answer that fits the facts best scores one point. Some other answers are partly right: they point the right way but claim too much, or they reach the right answer for the wrong reason. These score half a point. A clearly wrong answer takes half a point away. “I&#x27;m not sure” scores nothing, and so does a question you skip, which means a wrong guess costs you more than an honest “I&#x27;m not sure”. With 18 questions, the highest score is 18. A coloured bar then shows where your score sits, from red to green, with the turn at about 12 points.<\/p><p>We take points away so that guessing does not pay. Someone who picked answers at random would end up with about one point. Which answers count as partly right is our own judgement, and this draft is testing that too.<\/p><h2>Where we are<\/h2><p>The work has two phases. In the first we define the principles and the test. In the second a small group of friends and family tries the test, and we change the principles where their feedback shows we got something wrong.<\/p><p>This preview is a draft: 18 questions in six situations, in English and Italian. Nobody is told they passed or failed. The bar turns from red to green at about 12 points; that point is a first choice, and the pilot will show whether it is right. At the end you see your score, where it sits on the bar, and the explanation for each answer. If you like, one button sends us your answers, with an anonymous comment if you write one. Your answers stay on your device unless you send them.<\/p><h2>What we have not answered<\/h2><ul><li>What would passing the test give someone, and how would that relate to the right to vote they already have?<\/li><li>How can a test avoid rewarding schooling, fluent speech or answers learned by heart?<\/li><li>Who should write and review the questions, and how could someone challenge a result?<\/li><li>In the past, tests for voting have been used to keep people out. How do we make sure this one could never be used that way?<\/li><\/ul><p>Your feedback is how we find out where this thinking is wrong.<\/p>", "it": "<h2>Lo spirito<\/h2><p>Quando votiamo, contribuiamo a scegliere chi eserciterà il potere politico. Come arriviamo a quella scelta? Civic Pulse parte dall’idea che per scegliere bene servano tempo, attenzione e la volontà di ragionare con la propria testa. Né un titolo di studio né il partito che una persona sostiene ci dicono se lo fa. È questa l’idea che vogliamo mettere alla prova.<\/p><h2>Il principio<\/h2><p>Chi ha una carica politica esercita un potere sugli altri. Anche chi vota lo esercita, in modo diverso: sceglie chi avrà quella carica.<\/p><p>Il principio da cui partiamo è che in tutti e due i casi serva una verifica di idoneità, fatta con la stessa cura. L&#x27;idea viene dal confronto con l&#x27;esame della patente: prima di fare qualcosa che può avere conseguenze sugli altri, si dimostra di essere pronti.<\/p><p>Questo principio fa parte del progetto, e lo stiamo mettendo alla prova: non descrive nessuna legge in vigore, e non sappiamo ancora se regge.<\/p><h2>L&#x27;idea centrale<\/h2><p>Una verifica di idoneità deve essere equa per chiunque la affronti. Per questo Civic Pulse usa un test di pensiero critico, cioè di come una persona pesa motivi, prove e conclusioni.<\/p><p>Le domande ti chiedono di valutare le informazioni di una breve storia e di scegliere la risposta più coerente con i fatti. Il test non chiede cosa pensi della politica, e nessuna risposta viene premiata perché dà ragione a una parte.<\/p><h2>Il metodo<\/h2><ul><li>Ogni domanda parte da una breve situazione quotidiana: una panetteria, un cartello stradale, un pranzo sparito. Tutti i fatti che servono sono nella situazione.<\/li><li>Non c&#x27;è un tempo limite: puoi fermarti, tornare indietro e cambiare una risposta.<\/li><li>Cerchiamo di usare parole comuni, così puoi concentrarti sul ragionamento.<\/li><li>Le domande si possono ascoltare oltre che leggere: così può partecipare anche chi non vede lo schermo.<\/li><li>Un&#x27;app applica a tutti le stesse regole di punteggio, così il giudizio personale di un esaminatore non pesa sul risultato. Se questo basti a rendere il test equo, dobbiamo ancora verificarlo.<\/li><li>Per ogni domanda c&#x27;è una spiegazione scritta della risposta giusta, così chiunque può capire perché è valutata in quel modo.<\/li><li>Le domande sono scritte da noi. Test di ragionamento già esistenti, come il Watson-Glaser, ci hanno dato qualche idea, ma non ne abbiamo copiato le domande.<\/li><\/ul><h2>Come funziona il punteggio<\/h2><p>Ogni risposta vale dei punti. La risposta più coerente con i fatti vale un punto. Alcune altre risposte sono in parte giuste: vanno nella direzione giusta ma dicono troppo, oppure arrivano alla risposta giusta per un motivo sbagliato. Queste valgono mezzo punto. Una risposta chiaramente sbagliata toglie mezzo punto. “Non saprei” non vale niente, e neanche una domanda lasciata senza risposta: per questo un tentativo sbagliato costa più di un “Non saprei” sincero. Con 18 domande, il punteggio massimo è 18. Poi una barra colorata mostra dove si colloca il tuo punteggio, dal rosso al verde, con il passaggio intorno ai 12 punti.<\/p><p>Togliamo punti perché tirare a indovinare non convenga. Chi scegliesse le risposte a caso arriverebbe più o meno a un punto. Quali risposte contino come in parte giuste lo decidiamo noi, e anche questo è uno degli aspetti che la bozza mette alla prova.<\/p><h2>A che punto siamo<\/h2><p>Il lavoro è diviso in due fasi. Nella prima definiamo i principi e il test. Nella seconda un piccolo gruppo di amici e familiari prova il test, e noi correggiamo i principi dove i loro commenti mostrano che abbiamo sbagliato qualcosa.<\/p><p>Questa anteprima è una bozza: 18 domande in sei situazioni, in italiano e in inglese. Nessuno viene promosso o bocciato. La barra passa dal rosso al verde intorno ai 12 punti: è una prima scelta, e la prova ci dirà se è quella giusta. Alla fine vedi il tuo punteggio, dove si colloca sulla barra e la spiegazione di ogni risposta. Se vuoi, con un solo pulsante ci invii le risposte, insieme a un commento anonimo se lo scrivi. Le risposte restano sul tuo dispositivo, a meno che tu non decida di inviarle.<\/p><h2>Le domande ancora aperte<\/h2><ul><li>Cosa otterrebbe chi supera il test, e che rapporto avrebbe con il diritto di voto che ha già?<\/li><li>Come può un test evitare di premiare chi ha studiato di più, chi parla meglio o chi impara le risposte a memoria?<\/li><li>Chi dovrebbe scrivere e rivedere le domande, e come si potrebbe contestare un risultato?<\/li><li>In passato i test per poter votare sono stati usati per escludere certe persone. Come possiamo garantire che questo non venga mai usato così?<\/li><\/ul><p>I tuoi commenti ci servono a capire dove questo ragionamento non regge.<\/p>"}, "langs": {"en": [{"title": "Practice (not scored)", "text": "Tom looks out of the window and sees that it is raining. He says: \"It's raining, so I'll take my umbrella.\"", "questions": [{"id": "P.1", "q": "What is Tom going to do?", "options": [{"letter": "A", "text": "Stay at home"}, {"letter": "B", "text": "Take his umbrella"}, {"letter": "C", "text": "Buy a new umbrella"}]}]}, {"title": "1. The bakery", "text": "Lucia has a small bakery. Last month she also started selling her bread at the weekly street market. In the same month, sales in her shop went down. Lucia says: \"The market stall is taking customers away from my shop.\"", "questions": [{"id": "1.1", "q": "What does Lucia think is happening?", "options": [{"letter": "A", "text": "Her market stall now sells more bread than her shop"}, {"letter": "B", "text": "People in town are buying less bread than before"}, {"letter": "C", "text": "Her shop customers now buy at her stall instead"}, {"letter": "D", "text": "She should stop selling at the market to save her shop"}]}, {"id": "1.2", "q": "Which fact would help most to check whether Lucia is right?", "options": [{"letter": "A", "text": "Whether her shop customers now buy at the stall"}, {"letter": "B", "text": "How much bread she has sold at the stall each week since it opened"}, {"letter": "C", "text": "How many people visit the street market each week"}, {"letter": "D", "text": "Whether her stall makes more money than it costs her"}]}, {"id": "1.3", "q": "Which fact, if true, could also explain why her shop sales went down?", "options": [{"letter": "A", "text": "Her bread sold out at the market every week"}, {"letter": "B", "text": "A new supermarket with a bakery opened on her street last month"}, {"letter": "C", "text": "Two regular customers from the shop told her they now buy from her stall"}, {"letter": "D", "text": "Her shop kept the same opening hours as before"}]}]}, {"title": "2. The speed sign", "text": "On a quiet street where people live, cars often drove fast. In March, the town put up a sign that shows the speed limit. In April, a neighbour, Paolo, says: \"Since the sign went up, the cars are slower. The sign works.\" Paolo has not measured how fast the cars go. He says it feels slower when he walks his dog in the morning.", "questions": [{"id": "2.1", "q": "What is wrong with Paolo's reason?", "options": [{"letter": "A", "text": "He lives on the street, so his view counts for less than someone passing through"}, {"letter": "B", "text": "He does not say what speed limit the sign shows, so we cannot check him"}, {"letter": "C", "text": "Signs like this one never change how people drive, so he must be wrong"}, {"letter": "D", "text": "He did not measure anything. He goes by his morning walks"}]}, {"id": "2.2", "q": "Suppose the cars really are slower in April. Which fact would mean the sign may not be the reason?", "options": [{"letter": "A", "text": "The sign is large, bright and easy to see from a moving car"}, {"letter": "B", "text": "Several other neighbours also say the cars are slower now"}, {"letter": "C", "text": "Road works began on the street in April, and drivers slow down to pass them"}, {"letter": "D", "text": "There were fewer accidents on the street in April than in the months before the sign"}]}, {"id": "2.3", "q": "Another neighbour, Sara, has a camera that recorded the speed of cars before and after the sign went up. It shows almost no change. What is the best thing to think now?", "options": [{"letter": "A", "text": "Sara's recording is better evidence, so the sign has probably not made the cars slower"}, {"letter": "B", "text": "Paolo is not telling the truth about the cars on his street"}, {"letter": "C", "text": "The two neighbours disagree, so we cannot know anything about the sign"}, {"letter": "D", "text": "Both kinds of evidence count the same, so the truth is somewhere in between the two"}]}]}, {"title": "3. The phone charger", "text": "A website sells a phone charger. It has 200 reviews. Almost all of them give five stars and say \"Great charger!\" Many of the reviews were posted on the same day. Marta wants to buy one. She says: \"So many good reviews. It must be a good charger.\"", "questions": [{"id": "3.1", "q": "Why should Marta be careful about these reviews?", "options": [{"letter": "A", "text": "200 reviews are too few to judge a charger that many people buy"}, {"letter": "B", "text": "Five-star reviews on websites are always fake"}, {"letter": "C", "text": "Many repeat the same words on one day, so some may be fake"}, {"letter": "D", "text": "Marta has not tried the charger herself, so the reviews cannot help her"}]}, {"id": "3.2", "q": "What would help Marta most to decide whether the charger is good?", "options": [{"letter": "A", "text": "Another 200 reviews of the charger from the same website"}, {"letter": "B", "text": "How many people have bought the charger from the website in the last year"}, {"letter": "C", "text": "Whether the charger is the cheapest one the website sells"}, {"letter": "D", "text": "An outside test, by a group the seller does not control"}]}, {"id": "3.3", "q": "Marta then reads that a consumer group tested the charger. It found that the charger works, but gets very hot. What should Marta think now?", "options": [{"letter": "A", "text": "The test proves that the charger is dangerous to use"}, {"letter": "B", "text": "It works, but the heat is now a reason to worry"}, {"letter": "C", "text": "The test agrees that the charger works, so the reviews were right"}, {"letter": "D", "text": "The test and the reviews disagree, so she cannot trust either of them"}]}]}, {"title": "4. The green tea", "text": "It is May. A family friend, Gianni, says: \"In January I started drinking a cup of green tea every morning. I have not had a cold since. Green tea stops colds.\"", "questions": [{"id": "4.1", "q": "What is the main point Gianni is making?", "options": [{"letter": "A", "text": "Green tea stops people from getting colds"}, {"letter": "B", "text": "He has not had a cold since January"}, {"letter": "C", "text": "Drinking something warm every morning is good for you"}, {"letter": "D", "text": "Everyone should drink green tea every morning"}]}, {"id": "4.2", "q": "Which fact could also explain why Gianni has had no cold since January?", "options": [{"letter": "A", "text": "Gianni's brother also drinks green tea and has not had a cold either"}, {"letter": "B", "text": "In February, Gianni started working from home and now sees far fewer people"}, {"letter": "C", "text": "Gianni says he has felt healthier since he started the tea"}, {"letter": "D", "text": "Gianni had a cold last December, before he started the tea"}]}, {"id": "4.3", "q": "Does Gianni's experience show that green tea stops colds for other people?", "options": [{"letter": "A", "text": "Yes, because it worked for him"}, {"letter": "B", "text": "Yes, if other people drink as much as he does"}, {"letter": "C", "text": "No, because Gianni may not be telling the truth"}, {"letter": "D", "text": "No. One person over a few months cannot show this"}]}]}, {"title": "5. The missing lunch", "text": "In a shared office kitchen, Anna put her lunch in the fridge at nine in the morning. At noon it was gone. Anna says: \"It was Luca. He was the last person to go into the kitchen.\"", "questions": [{"id": "5.1", "q": "Does \"he was the last person to go into the kitchen\" show that Luca took the lunch?", "options": [{"letter": "A", "text": "Yes. If he was the last one to go in, nobody else had the chance"}, {"letter": "B", "text": "It is a reason to ask Luca, not proof that he took it"}, {"letter": "C", "text": "No. Being in the kitchen tells us nothing at all about the lunch"}, {"letter": "D", "text": "Yes, because Anna knows her colleagues and is sure it was him"}]}, {"id": "5.2", "q": "What would help most to find out what happened to the lunch?", "options": [{"letter": "A", "text": "Whether Luca says, when asked, that he did not take it"}, {"letter": "B", "text": "How sure Anna is that it was Luca"}, {"letter": "C", "text": "Who else went into the kitchen between nine and noon"}, {"letter": "D", "text": "Whether Anna and Luca get on well"}]}, {"id": "5.3", "q": "A cleaner then says that at eleven o'clock she emptied the fridge and threw away all food without a name on it. Anna's lunch had no name on it. What is the best thing to think now?", "options": [{"letter": "A", "text": "The cleaner is only saying this to protect Luca from blame"}, {"letter": "B", "text": "Nobody can ever know what happened, so it does not matter"}, {"letter": "C", "text": "Luca could still have taken it before eleven, so he is still the most likely"}, {"letter": "D", "text": "The cleaner probably threw it away, so blaming Luca no longer makes sense"}]}]}, {"title": "6. The library at work", "text": "A company has a small library for its staff. The managers want to close it. They say: \"Hardly anyone uses the library. Last year only a few people borrowed books.\" A group of staff reply that many people go to the library to read the newspapers, work in a quiet place and study for courses. These visits do not show up in the borrowing records.", "questions": [{"id": "6.1", "q": "What reason do the managers give for closing the library?", "options": [{"letter": "A", "text": "Closing it will save the company money"}, {"letter": "B", "text": "People now read on their phones instead of borrowing books"}, {"letter": "C", "text": "Few people use the library"}, {"letter": "D", "text": "The company needs the room for something else"}]}, {"id": "6.2", "q": "How does the staff's reply affect the managers' reason?", "options": [{"letter": "A", "text": "It proves that the managers are wrong and the library must stay open"}, {"letter": "B", "text": "It shows the records may miss other ways people use the library"}, {"letter": "C", "text": "It does not matter, because borrowing books is what a library is for"}, {"letter": "D", "text": "It shows that the managers really want the room for something else"}]}, {"id": "6.3", "q": "Which fact would best show how much the library is really used?", "options": [{"letter": "A", "text": "A count of everyone who comes in, over several normal weeks"}, {"letter": "B", "text": "The number of books borrowed in each of the last five years"}, {"letter": "C", "text": "How many staff say in a survey that they would miss the library"}, {"letter": "D", "text": "How much it costs the company to keep the library open"}]}]}], "it": [{"title": "Prova (non conta per il punteggio)", "text": "Tom guarda fuori dalla finestra e vede che piove. Dice: «Piove, quindi prendo l'ombrello.»", "questions": [{"id": "P.1", "q": "Cosa farà Tom?", "options": [{"letter": "A", "text": "Resterà a casa"}, {"letter": "B", "text": "Prenderà l'ombrello"}, {"letter": "C", "text": "Comprerà un ombrello nuovo"}]}]}, {"title": "1. La panetteria", "text": "Lucia ha una piccola panetteria. Il mese scorso ha cominciato a vendere il suo pane anche al mercato settimanale, con una bancarella. Nello stesso mese le vendite in negozio sono calate. Lucia dice: «La bancarella mi sta portando via i clienti del negozio.»", "questions": [{"id": "1.1", "q": "Secondo Lucia, cosa sta succedendo?", "options": [{"letter": "A", "text": "Ora la bancarella vende più pane del negozio"}, {"letter": "B", "text": "In città la gente compra meno pane di prima"}, {"letter": "C", "text": "Chi comprava in negozio ora va alla bancarella"}, {"letter": "D", "text": "Dovrebbe smettere di vendere al mercato per salvare il negozio"}]}, {"id": "1.2", "q": "Quale informazione aiuterebbe di più a capire se Lucia ha ragione?", "options": [{"letter": "A", "text": "Se chi comprava in negozio ora compra alla bancarella"}, {"letter": "B", "text": "Quanto pane vende ogni settimana alla bancarella da quando ha cominciato"}, {"letter": "C", "text": "Quante persone vanno al mercato ogni settimana"}, {"letter": "D", "text": "Se con la bancarella guadagna più di quanto spende"}]}, {"id": "1.3", "q": "Quale fatto, se fosse vero, potrebbe spiegare in un altro modo il calo delle vendite in negozio?", "options": [{"letter": "A", "text": "Al mercato vendeva tutto il pane ogni settimana"}, {"letter": "B", "text": "Il mese scorso, nella sua via, ha aperto un supermercato che vende pane"}, {"letter": "C", "text": "Due clienti abituali le hanno detto che ora comprano da lei al mercato"}, {"letter": "D", "text": "Gli orari del negozio sono rimasti gli stessi"}]}]}, {"title": "2. Il cartello", "text": "In una via residenziale tranquilla, le auto spesso andavano forte. A marzo il Comune ha messo un cartello con il limite di velocità. Ad aprile un vicino, Paolo, dice: «Da quando c'è il cartello le auto vanno più piano. Il cartello funziona.» Paolo non ha misurato la velocità. Dice che ha questa impressione quando porta fuori il cane, la mattina.", "questions": [{"id": "2.1", "q": "Cosa non va nel ragionamento di Paolo?", "options": [{"letter": "A", "text": "Abita in quella via, quindi la sua opinione vale meno di quella di un passante"}, {"letter": "B", "text": "Non dice quale limite c'è sul cartello, quindi non possiamo controllare"}, {"letter": "C", "text": "Cartelli come questo non cambiano mai il modo di guidare, quindi Paolo sbaglia"}, {"letter": "D", "text": "Non ha misurato niente: si basa su un'impressione, e solo di mattina"}]}, {"id": "2.2", "q": "Supponiamo che ad aprile le auto vadano davvero più piano. Quale fatto vorrebbe dire che forse non è merito del cartello?", "options": [{"letter": "A", "text": "Il cartello è grande, luminoso e ben visibile da chi guida"}, {"letter": "B", "text": "Anche altri vicini dicono che ora le auto vanno più piano"}, {"letter": "C", "text": "Ad aprile sono iniziati dei lavori nella via, e per passare bisogna rallentare"}, {"letter": "D", "text": "Ad aprile ci sono stati meno incidenti nella via rispetto ai mesi prima del cartello"}]}, {"id": "2.3", "q": "Un'altra vicina, Sara, ha una telecamera che ha registrato la velocità delle auto prima e dopo il cartello. Non si vede quasi nessuna differenza. Cosa è più sensato pensare adesso?", "options": [{"letter": "A", "text": "Le misurazioni di Sara sono più affidabili. Probabilmente il cartello non ha fatto rallentare le auto"}, {"letter": "B", "text": "Paolo non dice la verità su come vanno le auto nella sua via"}, {"letter": "C", "text": "I due vicini dicono cose diverse, quindi sul cartello non possiamo sapere niente"}, {"letter": "D", "text": "La registrazione e l'impressione valgono lo stesso, quindi la verità sta nel mezzo"}]}]}, {"title": "3. Il caricabatterie", "text": "Un sito vende un caricabatterie per il telefono. Ha 200 recensioni: quasi tutte danno cinque stelle e dicono «Ottimo caricabatterie!». Molte sono state pubblicate lo stesso giorno. Marta vuole comprarlo e dice: «Quante recensioni positive! Dev'essere un buon caricabatterie.»", "questions": [{"id": "3.1", "q": "Perché Marta dovrebbe fare attenzione a queste recensioni?", "options": [{"letter": "A", "text": "200 recensioni sono troppo poche per giudicare un caricabatterie che comprano in tanti"}, {"letter": "B", "text": "Le recensioni online a cinque stelle sono sempre false"}, {"letter": "C", "text": "Molte sono uguali e pubblicate lo stesso giorno: alcune potrebbero essere false"}, {"letter": "D", "text": "Marta non l'ha ancora provato, quindi le recensioni non possono aiutarla"}]}, {"id": "3.2", "q": "Cosa aiuterebbe di più Marta a capire se il caricabatterie è davvero buono?", "options": [{"letter": "A", "text": "Altre 200 recensioni del caricabatterie sullo stesso sito"}, {"letter": "B", "text": "Quante persone hanno comprato il caricabatterie sul sito nell'ultimo anno"}, {"letter": "C", "text": "Se è il caricabatterie più economico tra quelli che vende il sito"}, {"letter": "D", "text": "Un test fatto da qualcuno che     ${canSpeak ? `<p>${T().listen}</p>` : ""}
    <p><a href="#about">${esc(T().aboutInvite)}</a></p>
    <div class="row"><button class="big" type="button" id="start">${started ? T().cont : T().start}</button></div>
  </section>`;
}

function question(i) {
  const { s, q } = items[i];
  const picked = answers[q.id];
  const key = RES.keys[q.id];
  const opts = [...q.options, { letter: "?", text: T().unsure }].map((o) => {
    let cls = "opt", tag = "";
    if (revealed) {
      const st = catOf(q.id, o.letter), pts = hasPoints(q.id) ? ` · ${signed(pointsOf(q.id, o.letter))}` : "";
      const tone = { right: " ok", partial: " half", wrong: " no", unsure: "" }[st];
      if (o.letter === key) {
        cls += " is-key"; tag = `<span class="tag ok">${picked === key ? T().yourRight : T().keyTag}${pts}</span>`;
      } else if (o.letter === picked) {
        cls += { partial: " is-half", wrong: " is-wrong", unsure: " is-mine" }[st];
        tag = `<span class="tag${tone}">${T().yourTag}${pts}</span>`;
      } else if (pts) tag = `<span class="tag">${pts.slice(3)}</span>`;
    } else if (picked === o.letter) tag = `<span class="tick">${T().chosen}</span>`;
    return `
    <li><button type="button" class="${cls}" data-l="${o.letter}" aria-pressed="${picked === o.letter}"${revealed ? ' aria-disabled="true"' : ""}>
      <span class="letter">${o.letter}</span><span>${esc(o.text)}</span>${tag}
    </button></li>`;
  }).join("");
  return `<div class="panel">
    ${isPractice(q) ? `<span class="chip">${T().practiceChip}</span>` : ""}
    <section class="situation">
      <h2><span>${esc(s.title.replace(/^\d+\.\s*/, "").replace(/\s*\(.*\)$/, ""))}</span>${canSpeak ? `<button class="say" type="button" id="say"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>${T().readAloud}</button>` : ""}</h2>
      <p>${esc(s.text)}</p>
    </section>
    <p class="question">${esc(q.q)}</p>
    <ul class="options">${opts}</ul>
    ${revealed ? `<section class="reason"><h2>${T().whyTitle}</h2><p>${esc(RES.why[lang][q.id])}</p></section>` : ""}
  </div>`;
}

function sendStep() {
  const title = T().step1Title;
  const same = sentLine === sendKey() && sentComment === comment;
  const label = sendState === "sending" ? T().sending : same ? T().sentBtn : sentLine ? T().sendAgain : T().sendAnswers;
  const note = sendState === "failed"
    ? `<p class="note">${esc(T().failNote)} <a href="${esc(formLink())}" target="_blank" rel="noopener">${esc(T().failLink)}</a></p>`
    : same ? `<p class="note">${esc(T().sentNote)}</p>` : "";
  return `<section class="step">
    <h2>${esc(title)}</h2>
    <p>${esc(T().step1Text(code))}</p>
    <label for="comment">${esc(T().commentLabel)}</label>
    <ul>${T().prompts.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <textarea id="comment" rows="4">${esc(comment)}</textarea>
    <div class="row"><button class="big" type="button" id="send"${sendState === "sending" || same ? " disabled" : ""}>${esc(label)}</button></div>
    ${note}
  </section>`;
}

function revealStep() {
  return `<section class="step">
    <h2>${T().step2Title}</h2>
    <p>${esc(T().step2Text)}</p>
    ${confirmReveal
      ? `<p><strong>${esc(T().confirmReveal)}</strong></p>
    <div class="row"><button class="big" type="button" id="reveal-yes">${T().revealYes}</button><button class="big quiet" type="button" id="reveal-no">${T().revealNo}</button></div>`
      : `<div class="row"><button class="big" type="button" id="reveal">${T().showResults}</button></div>`}
  </section>`;
}

function clearRow() {
  return `<div class="row">${confirmClear
    ? `<button class="big" type="button" id="clear-yes">${T().clearYes}</button><button class="big quiet" type="button" id="clear-no">${T().clearNo}</button>`
    : `<button class="big quiet" type="button" id="clear">${T().clear}</button>`}</div>`;
}
// After results: Restart beside "Go through the questions"; the same clear, worded as starting again.
function resultsRow() {
  return confirmClear
    ? `<p><strong>${esc(T().restartNote)}</strong></p>
    <div class="row"><button class="big" type="button" id="clear-yes">${T().restartYes}</button><button class="big quiet" type="button" id="clear-no">${T().restartNo}</button></div>`
    : `<div class="row"><button class="big" type="button" id="review">${T().review}</button><button class="big quiet" type="button" id="clear">${T().restart}</button></div>`;
}

// Where the score sits between 0 and the highest score; below 0 sits at the left end.
function gauge() {
  const max = maxTotal(), mid = RES.score.pass, at = (v) => (Math.max(0, Math.min(max, v)) / max) * 100;
  const pct = at(total()), edge = pct < 8 ? " edge-l" : pct > 92 ? " edge-r" : "";
  const marks = [0, Math.round(max / 3), mid, max].filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b);
  const ticks = marks.map((v) => `<span class="${v === mid ? "mid" : ""}" style="left:${at(v)}%">${num(v)}</span>`).join("");
  return `<div class="gauge" role="img" style="--mid:${at(mid)}%" aria-label="${esc(T().gaugeLabel(num(total()), num(max), num(mid)))}">
      <div class="pin${edge}" style="left:${pct}%"><b>${T().you} · ${num(total())}</b><i></i><s></s></div>
      <div class="track"></div>
      <div class="notch" style="left:${at(mid)}%"></div>
      <div class="ticks">${ticks}</div>
    </div>`;
}

function end() {
  const sc = scored();
  if (revealed) {
    const mark = { right: "ok", partial: "half", wrong: "no", unsure: "na", blank: "na" };
    const rows = sc.map((it) => {
      const st = status(it.q.id);
      return `<li><button class="ghost" type="button" data-go="${items.indexOf(it) + 1}">${esc(it.q.id)}</button><span class="mark ${mark[st]}">${T().st[st]}</span><span class="pts mark ${mark[st]}">${signed(points(it.q.id))}</span></li>`;
    }).join("");
    const f = Object.fromEntries(Object.entries(RES.score.table).map(([k, v]) => [k, signed(v)]));
    return `<section class="panel">
    <h2>${T().resultsTitle}</h2>
    ${returned ? `<p class="note">${esc(T().lastScore)}</p>` : ""}
    <p class="score">${T().score(num(total()), num(maxTotal()))}</p>
    ${gauge()}
    <p>${esc(T().where(num(RES.score.pass)))}</p>
    <p class="summary">${T().counts(counts())}</p>
    <p>${esc(T().how(f))}</p>
    <p>${esc(T().draftNote)}</p>
    ${resultsRow()}
    <ul class="results">${rows}</ul>
    ${sendStep()}
  </section>`;
  }
  const done = sc.filter((it) => answers[it.q.id] !== undefined).length;
  const unsure = tally("unsure");
  const missing = sc.filter((it) => answers[it.q.id] === undefined).map((it) => it.q.id);
  return `<section class="panel">
    <h2>${T().thanks}</h2>
    <p class="summary">${T().answered(done, sc.length)}${unsure ? ` · ${T().unsureN(unsure)}` : ""}</p>
    ${missing.length ? `<p>${esc(T().missing(missing.join(", ")))}</p>` : ""}
    ${revealStep()}
    ${clearRow()}
  </section>`;
}

function about() {
  return `<article class="about">${BANK.about[lang]}
    <div class="row"><button class="big" type="button" id="about-back">${T().aboutBack}</button></div>
  </article>`;
}

function render() {
  if (canSpeak) speechSynthesis.cancel();
  const reading = location.hash === "#about";
  document.body.classList.toggle("reading", reading);
  $("about-link").textContent = T().aboutLink;
  $("about-link").hidden = reading;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("eyebrow").textContent = `${T().eyebrow} · v${BANK.version}`;
  $("h1").textContent = reading ? T().aboutTitle : T().h1;
  const atResults = screen === END && revealed;
  $("prev").textContent = atResults ? T().home : fromResults && screen > 0 && screen < END ? T().backResults : T().back;
  $("next").hidden = atResults;
  $("prog").style.width = `${(screen / END) * 100}%`;
  $("prev").disabled = screen === 0;
  $("next").disabled = screen === END;
  $("next").textContent = screen === END - 1 ? T().finish : T().next;
  if (reading) {
    $("view").innerHTML = about();
    $("about-back").addEventListener("click", () => { location.hash = ""; window.scrollTo(0, 0); });
    return;
  }
  if (screen === 0) { $("count").textContent = ""; $("view").innerHTML = welcome(); }
  else if (screen === END) { $("count").textContent = ""; $("view").innerHTML = end(); }
  else {
    const it = items[screen - 1];
    const n = items.slice(0, screen).filter((x) => !isPractice(x.q)).length;
    $("count").textContent = isPractice(it.q) ? T().practice : T().qOf(n, scored().length);
    $("view").innerHTML = question(screen - 1);
    if (!revealed) $("view").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
      answers[it.q.id] = b.dataset.l; save(); render();
    }));
    const say = $("say");
    const mine = answers[it.q.id];
    const after = revealed ? ` ${T().keyTag}: ${RES.keys[it.q.id]}.${mine === undefined || !hasPoints(it.q.id) ? "" : ` ${T().yourTag}: ${mine === "?" ? T().unsure : mine}, ${T().scores} ${signed(points(it.q.id))}.`} ${T().whyTitle}. ${RES.why[lang][it.q.id]}` : "";
    if (say) say.addEventListener("click", () => speak(
      `${it.s.text} ${it.q.q} ${it.q.options.map((o) => `${o.letter}. ${o.text}.`).join(" ")} ${T().unsure}.${after}`));
  }
  const bind = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  bind("start", () => go(1));
  bind("clear", () => { confirmClear = true; render(); });
  bind("clear-no", () => { confirmClear = false; render(); });
  bind("clear-yes", () => {
    answers = {}; confirmClear = false; revealed = false; opened = false; attempt += 1;
    sentLine = null; sentComment = ""; comment = ""; sendState = "idle";
    go(0);
  });
  bind("send", sendAnswers);
  const box = $("comment");
  if (box) box.addEventListener("input", () => {
    comment = box.value;
    const btn = $("send");  // update the button without a re-render, so typing keeps focus
    if (btn && sendState !== "sending") {
      const same = sentLine === sendKey() && sentComment === comment;
      btn.disabled = same; btn.textContent = same ? T().sentBtn : sentLine ? T().sendAgain : T().sendAnswers;
    }
  });
  bind("reveal", () => { confirmReveal = true; render(); });
  bind("reveal-no", () => { confirmReveal = false; render(); });
  bind("reveal-yes", () => {
    revealed = true; confirmReveal = false;
    if (seenAt === null) seenAt = attempt;
    save(); render(); window.scrollTo(0, 0);
  });
  bind("review", () => { fromResults = false; go(1); });
  bind("to-results", () => go(END));
  $("view").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { fromResults = true; go(Number(b.dataset.go)); }));
}

function go(n) { returned = false; if (n !== 0) justSent = false; screen = Math.max(0, Math.min(END, n)); if (screen === 0 || screen === END) fromResults = false; confirmClear = false; confirmReveal = false; save(); render(); window.scrollTo(0, 0); }
$("prev").addEventListener("click", () => go(screen === END && revealed ? 0 : fromResults ? END : screen - 1));
$("next").addEventListener("click", () => go(screen + 1));
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang; load(); save(); render();
}));
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
</script>

</body>
</html>
